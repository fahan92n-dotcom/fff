name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pylint
    - name: Run unit tests
      run: python -m unittest discover -v
    - name: Analyse production code with Pylint
      run: |
        pylint \
          binance_data.py \
          cascade_pipeline.py \
          cascade_steps.py \
          config.py \
          fahadal92.py \
          indicators.py \
          main.py \
          state_manager.py \
          state_store.py \
          telegram_bot.py \
          tv_webhook.py
    - name: Reject unexplained broad exception handlers
      run: |
        pylint \
          --disable=all \
          --enable=broad-exception-caught \
          binance_data.py \
          cascade_pipeline.py \
          cascade_steps.py \
          config.py \
          fahadal92.py \
          indicators.py \
          main.py \
          state_manager.py \
          state_store.py \
          telegram_bot.py \
          tv_webhook.py
